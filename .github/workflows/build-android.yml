name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      commercial:
        description: Build and verify a signed APK with licence activation
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.commercial
        with:
          node-version: '22'
      - name: Prepare Android activation gate
        if: inputs.commercial
        env:
          UA_PUBLIC_JWK: ${{ vars.UA_PUBLIC_JWK }}
        run: |
          printf '%s' "$UA_PUBLIC_JWK" > "$RUNNER_TEMP/ua-public.json"
          node licensing/prepare-commercial.cjs android "$RUNNER_TEMP/ua-public.json" Android/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          HOSTED_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ -x "$HOSTED_SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDK_ROOT="$HOSTED_SDK"
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl --http1.1 --fail --location --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 30 --output "$RUNNER_TEMP/android-cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        if: ${{ !inputs.commercial }}
        working-directory: Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: ${{ !inputs.commercial }}
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Accounting-Android-Debug
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        if: inputs.commercial
        working-directory: Android
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign and verify release APK
        if: inputs.commercial
        env:
          UA_ANDROID_KEYSTORE_BASE64: ${{ secrets.UA_ANDROID_KEYSTORE_BASE64 }}
          UA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.UA_ANDROID_KEYSTORE_PASSWORD }}
          UA_ANDROID_KEY_ALIAS: ${{ secrets.UA_ANDROID_KEY_ALIAS }}
          UA_ANDROID_KEY_PASSWORD: ${{ secrets.UA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${UA_ANDROID_KEYSTORE_BASE64:?Missing key store}" "${UA_ANDROID_KEYSTORE_PASSWORD:?Missing key store password}" "${UA_ANDROID_KEY_ALIAS:?Missing key alias}" "${UA_ANDROID_KEY_PASSWORD:?Missing key password}"
          umask 077
          KEYSTORE="$RUNNER_TEMP/ua-release-keystore"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$UA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p release
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$UA_ANDROID_KEY_ALIAS" \
            --ks-pass env:UA_ANDROID_KEYSTORE_PASSWORD --key-pass env:UA_ANDROID_KEY_PASSWORD \
            --out release/Universal-Accounting-Android.apk Android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs release/Universal-Accounting-Android.apk
          (cd release && sha256sum Universal-Accounting-Android.apk > SHA256SUMS.txt)

      - name: Upload signed Android APK
        if: inputs.commercial
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Accounting-Android-Signed
          path: release/
          if-no-files-found: error
