name: Build Windows Installer
on:
  workflow_dispatch:
    inputs:
      commercial:
        description: Build and verify a signed installer with licence activation
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Android/app/src/main/assets/index.html'
      - '.github/workflows/build-windows.yml'
jobs:
  windows-installer:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: Windows
        run: npm ci --no-audit --no-fund
      - name: Prepare shared application and original icon
        working-directory: Windows
        run: node prepare-assets.js
      - name: Prepare Windows activation gate
        if: inputs.commercial
        working-directory: Windows
        env:
          UA_PUBLIC_JWK: ${{ vars.UA_PUBLIC_JWK }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'ua-public.json'
          Set-Content -Path $keyPath -Value $env:UA_PUBLIC_JWK -Encoding utf8NoBOM
          node ../licensing/prepare-commercial.cjs windows $keyPath index.html
      - name: Build unsigned Windows installer
        if: ${{ !inputs.commercial }}
        working-directory: Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Build and verify signed Windows installer
        if: inputs.commercial
        working-directory: Windows
        env:
          CSC_LINK: ${{ secrets.UA_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.UA_WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Windows signing credentials are required' }
          npm run dist:win -- --config.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem dist -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Invalid installer signature' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content dist/SHA256SUMS.txt
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Accounting-Windows-Installer
          path: |
            Windows/dist/*.exe
            Windows/dist/SHA256SUMS.txt
          if-no-files-found: error
