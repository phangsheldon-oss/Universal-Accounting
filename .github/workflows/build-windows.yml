name: Build Windows Installer
on:
  workflow_dispatch:
    inputs:
      commercial:
        description: Embed the owner's public licence verification key
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Android/app/src/main/assets/index.html'
      - '.github/workflows/build-windows.yml'
jobs:
  windows-installer:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: Windows
        run: npm install --no-audit --no-fund
      - name: Prepare shared application and original icon
        working-directory: Windows
        run: node prepare-assets.js
      - name: Prepare Windows activation gate
        if: inputs.commercial
        working-directory: Windows
        env:
          UA_PUBLIC_JWK: ${{ vars.UA_PUBLIC_JWK }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'ua-public.json'
          Set-Content -Path $keyPath -Value $env:UA_PUBLIC_JWK -Encoding utf8NoBOM
          node ../licensing/prepare-commercial.cjs windows $keyPath index.html
      - name: Build Windows installer
        working-directory: Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Accounting-Windows-Installer
          path: Windows/dist/*.exe
          if-no-files-found: error
