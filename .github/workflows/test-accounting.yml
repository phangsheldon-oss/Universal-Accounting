name: Test Universal Accounting
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Android/app/src/main/assets/index.html'
      - 'tests/**'
      - 'licensing/**'
      - '.github/workflows/test-accounting.yml'
jobs:
  accounting-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test tools
        run: npm install --no-save @playwright/test@1.51.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run fictional accounting tests
        run: npx playwright test tests/accounting.spec.cjs --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Accounting-Test-Report
          path: playwright-report/
