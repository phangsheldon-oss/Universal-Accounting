
plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.universalaccounting.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.universalaccounting.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.5.16'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
