'use strict';

// v0.5.10 — review all data-changing form submissions before posting or saving.
const reviewApproved=new WeakSet();
const reviewForms=new Set(['accountForm','capitalForm','pricingForm','vendorForm','itemForm','billForm','receiptForm','vendorPaymentForm','customerForm','invoiceForm','paymentForm','settingsForm','securityPasswordForm']);
const documentForms=new Set(['invoiceForm','paymentForm','billForm','receiptForm','vendorPaymentForm','capitalForm']);
function draftPanel(formId){
 const rows=(db.drafts||[]).filter(draft=>draft.formId===formId);
 if(!rows.length)return '';
 return '<div class="panel"><h2>Drafts</h2>'+table(['Draft','Date','Details','Action'],rows.map(draft=>[
  escapeHtml(draft.id),escapeHtml(draft.fields.date||''),escapeHtml(draft.summary),
  `<button type="button" data-edit-draft="${escapeHtml(draft.id)}">Open draft</button>`
 ]))+'</div>';
}
function billFormLines(form){
 return [...form.querySelectorAll('.bill-line')].map(line=>({
  item:line.querySelector('.line-item').value,quantity:line.querySelector('.line-qty').value,cost:line.querySelector('.line-cost').value
 }));
}
function saveDraft(form){
 safe(()=>{
  const draft={id:form.dataset.draftId||'DRAFT-'+crypto.randomUUID().slice(0,8),formId:form.id,
   fields:Object.fromEntries(new FormData(form)),lines:billFormLines(form),
   summary:reviewFields(form).slice(0,3).map(([label,value])=>label+': '+value).join(' · ')};
  db.drafts=[...(db.drafts||[]).filter(row=>row.id!==draft.id),draft];
  save();
  return draft.id;
 })&&message('Draft saved. Open it from Drafts to post.');
}
function openDraft(draftId){
 const draft=(db.drafts||[]).find(row=>row.id===draftId);
 if(!draft)return;
 const form=document.getElementById(draft.formId);
 if(!form)return;
 render();
 const editor=document.getElementById(draft.formId);
 editor.dataset.draftId=draft.id;
 for(const [name,value] of Object.entries(draft.fields)){
  if(name==='line'&&draft.formId==='receiptForm')continue;
  const field=editor.elements.namedItem(name);
  if(field)field.value=value;
 }
 if(draft.formId==='invoiceForm'){
  const item=db.items.find(item=>item.id===draft.fields.product);
  editor.querySelector('#salesItemLookup').value=item?.sku||'';
 }
 if(draft.formId==='receiptForm'){
  refreshReceiptLines();
  editor.elements.namedItem('line').value=draft.fields.line||'';
  document.getElementById('receiptLine').dispatchEvent(new Event('change',{bubbles:true}));
 }
 if(draft.formId==='billForm'){
  const lines=editor.querySelector('#billLines');
  const template=lines.firstElementChild;
  lines.replaceChildren(...draft.lines.map(({item,quantity,cost})=>{
   const line=template.cloneNode(true);
   line.querySelector('.line-item').value=item;
   line.querySelector('.line-qty').value=quantity;
   line.querySelector('.line-cost').value=cost;
   return line;
  }));
  updateBillTotal();
 }
 message('Editing '+draft.id);
 editor.scrollIntoView({block:'start'});
}
function commitDocument(form,postDocument){
 return safe(()=>{
  if(form.dataset.draftId)db.drafts=db.drafts.filter(row=>row.id!==form.dataset.draftId);
  return postDocument();
 });
}
function reviewFields(form){
 const result=[];
 const inputs=[...form.querySelectorAll('input,select,textarea')];
 for(const el of inputs){

const baseAccounts={'1000':['Bank','Asset'],'1010':['Cash on Hand','Asset'],'1100':['Accounts Receivable','Asset'],'3000':['Owner Capital','Equity'],'4000':['Sales Revenue','Revenue'],'1200':['Inventory','Asset'],'1300':['Goods invoiced not received','Asset'],'2000':['Accounts Payable','Liability'],'3100':['Retained Earnings','Equity'],'3200':['Owner Drawings / Distributions','Equity'],'4100':['Service Revenue','Revenue'],'5000':['Cost of Goods Sold','Expense'],'6000':['Rent Expense','Expense'],'6100':['Utilities Expense','Expense'],'6200':['Transport Expense','Expense'],'2100':['Taxes Payable','Liability'],'1500':['Equipment','Asset']};
const accounts=new Proxy(baseAccounts,{get:(target,k)=>typeof k==='string'?(target[k]||db.customAccounts?.find(a=>a.code===k)?.tuple):undefined,ownKeys:target=>[...Reflect.ownKeys(target),...(db.customAccounts||[]).map(a=>a.code)],getOwnPropertyDescriptor:(target,k)=>Object.getOwnPropertyDescriptor(target,k)||((db.customAccounts||[]).some(a=>a.code===k)?{configurable:true,enumerable:true,value:db.customAccounts.find(a=>a.code===k).tuple,writable:true}:undefined)});

function updateItemPricing(itemId,cost,method,rate,manual,price){const i=db.items.find(x=>x.id===itemId);if(!i)throw Error('Product not found');const c=amount(cost),r=Number(rate);if(!Number.isFinite(r)||r<0||r>10000)throw Error('Invalid percentage');if(!['markup','margin','fixed','profit'].includes(method))throw Error('Invalid pricing method');if(method==='margin'&&r>=100)throw Error('Margin must be below 100%');let p=method==='fixed'?amount(price):method==='markup'?Math.round(c*(1+r/100)):method==='margin'?Math.round(c/(1-r/100)):c+amount(price);if(!Number.isSafeInteger(p)||p<=0)throw Error('Calculated selling price is invalid');i.standardCost=c;i.pricingMethod=method;i.pricingRate=r;i.sellingPrice=p;i.manualPrice=method==='fixed';save();return p}
function receiptLayers(itemId,asOf){
 const bills=new Map(db.vendorBills.map(bill=>[bill.id,bill]));
 const used=new Map();
 for(const invoice of db.invoices){
   for(const allocation of invoice.stock?.allocations||[]){
     used.set(allocation.receipt,(used.get(allocation.receipt)||0)+allocation.quantity);
   }
 }
 return db.receipts.flatMap(receipt=>{
   if(asOf&&receipt.date>asOf)return [];
   const bill=bills.get(receipt.bill);
   const line=bill&&billLines(bill).find(row=>row.id===(receipt.lineId||'L1'));
   if(line?.item!==itemId)return [];
   const remaining=receipt.quantity-(used.get(receipt.id)||0);
   if(remaining<0)throw Error('Stock receipts and sales do not reconcile');
   return remaining?[{receipt:receipt.id,date:receipt.date,quantity:remaining,unitCost:line.unitCost}]:[];
 }).sort((first,second)=>first.date.localeCompare(second.date));
}
function stockInfo(itemId){
 const layers=receiptLayers(itemId);
 const quantity=layers.reduce((total,layer)=>total+layer.quantity,0);
 const value=layers.reduce((total,layer)=>total+layer.quantity*layer.unitCost,0);
 return {quantity,value,averageCost:quantity?Math.round(value/quantity):0};
}
function allocateStock(item,quantity,date){
 if(!db.items.some(row=>row.id===item))throw Error('Product not found');
 if(db.invoices.some(invoice=>invoice.stock?.item===item&&invoice.date>date))throw Error('Stock sale date precedes a posted sale for this product');
 const allocations=[];
 let remaining=quantity,cost=0;
 for(const layer of receiptLayers(item,date)){
   const used=Math.min(remaining,layer.quantity);
   cost+=used*layer.unitCost;
   if(!Number.isSafeInteger(cost))throw Error('Stock cost is too large');
   allocations.push({receipt:layer.receipt,quantity:used});
   remaining-=used;
   if(!remaining)break;
 }
 if(remaining)throw Error('Insufficient goods received as of the invoice date');
 return {item,quantity,cost,allocations};
}
function invoiceBalance(i){return i.cents-db.payments.filter(p=>p.invoice===i.id).reduce((s,p)=>s+p.cents,0)}
function nextPartyId(kind){
 const prefix=kind==='customer'?'CUST':'VEND', records=kind==='customer'?db.customers:db.vendors;
 const used=new Set(records.map(x=>x.id));let n=Math.max(1,Number(db.partySequences?.[kind]||1));
 while(used.has(prefix+'-'+String(n).padStart(4,'0')))n++;

}

function createInvoice(customer,cents,date,description,item='',units=''){
 if(!db.customers.some(row=>row.id===customer))throw Error('Customer not found');
 validDate(date);
 positiveCents(cents);

 if(!description)throw Error('Description required');

 let total=0;const clean=lines.map((l,i)=>{if(!db.items.some(x=>x.id===l.item))throw Error('Product not found');const quantity=qty(l.quantity),unitCost=amount(l.cost);const sub=quantity*unitCost;if(!Number.isSafeInteger(sub)||!Number.isSafeInteger(total+sub))throw Error('Amount too large');total+=sub;return {id:'L'+(i+1),item:l.item,quantity,unitCost}});

function reportLine(code,value){return `<tr><td>${accountLink(code,code+' · '+accounts[code][0])}</td><td style="text-align:right">${db.currency} ${money(value/100)}</td></tr>`}
function reportGroup(title,rows,totalLabel,total){return `<h3>${title}</h3><div class="scroll"><table class="report-totals"><tbody>${rows.join('')||'<tr><td>No balances</td><td></td></tr>'}<tr><th>${totalLabel}</th><th style="text-align:right">${db.currency} ${money(total/100)}</th></tr></tbody></table></div>`}
function profitAndLoss(from,to){const b=datedBalances(from,to);const revenue=[],expense=[];let r=0,e=0,cogs=0;for(const [code,[name,type]] of Object.entries(accounts)){const v=b[code]||0;if(type==='Revenue'){r-=v;if(v)revenue.push(reportLine(code,-v))}if(type==='Expense'){e+=v;if(code==='5000')cogs+=v;if(v)expense.push(reportLine(code,v))}}const gross=r-cogs,net=r-e;return `<h1>Profit & Loss Statement</h1><div class="panel"><p class="muted">${escapeHtml(db.business)} · ${escapeHtml(from)} through ${escapeHtml(to)} · Accrual basis</p>${reportDates('pnl')}${reportGroup('Income',revenue,'Total revenue',r)}${reportGroup('Expenses',expense,'Total expenses (including cost of goods sold)',e)}<p><strong>Gross profit: ${db.currency} ${money(gross/100)}</strong></p><div class="account-balance">Net ${net>=0?'profit':'loss'}: ${db.currency} ${money(Math.abs(net)/100)}</div></div><p class="muted">This statement reflects posted journals only. Inventory invoices post cost of goods sold using FIFO. Review stock sales entered in earlier versions for any historical adjustments.</p>`}
function balanceSheet(to){const b=datedBalances(null,to);const asset=[],liability=[],equity=[];let a=0,l=0,q=0,income=0;for(const [code,[name,type]] of Object.entries(accounts)){const v=b[code]||0;if(type==='Asset'){a+=v;if(v)asset.push(reportLine(code,v))}else if(type==='Liability'){l-=v;if(v)liability.push(reportLine(code,-v))}else if(type==='Equity'){q-=v;if(v)equity.push(reportLine(code,-v))}else if(type==='Revenue')income-=v;else if(type==='Expense')income-=v}q+=income;equity.push(`<tr><td>Current-period and prior unclosed earnings (calculated)</td><td style="text-align:right">${db.currency} ${money(income/100)}</td></tr>`);const difference=a-l-q;return `<h1>Balance Sheet</h1><div class="panel"><p class="muted">${escapeHtml(db.business)} · As of ${escapeHtml(to)} · Accrual basis</p>${reportDates('bs')}${reportGroup('Assets',asset,'Total assets',a)}${reportGroup('Liabilities',liability,'Total liabilities',l)}${reportGroup('Equity',equity,'Total equity including earnings',q)}<div class="account-balance">Total liabilities + equity: ${db.currency} ${money((l+q)/100)}</div><p><strong>Accounting equation difference: ${db.currency} ${money(difference/100)}</strong></p>${difference===0?'<p class="success">Assets equal liabilities plus equity.</p>':'<p class="error">The accounting equation does not balance. Review posted journals.</p>'}</div><p class="muted">Earnings are calculated from all revenue and expense postings through the report date. Depreciation and tax adjustments require separate accounting records.</p>`}
function accountLink(code,label){return `<a href="#account-${escapeHtml(code)}" class="account-link" data-account="${escapeHtml(code)}">${escapeHtml(label)}</a>`}
function openAccount(code){if(!accounts[code]){message('Account not found',true);return}selectedAccount=code;navigate('Account Ledger')}
function accountLedger(code){const meta=accounts[code];if(!meta)return '<p>Account not found</p>';const [name,type]=meta;const entries=db.journals.flatMap((j,ji)=>j.lines.filter(l=>l.acct===code).map((l,li)=>({date:j.date,ref:j.ref,dr:l.dr,cr:l.cr,order:ji,sub:li}))).sort((a,b)=>a.date.localeCompare(b.date)||a.order-b.order||a.sub-b.sub);let running=0;const rows=entries.map(e=>{running+=e.dr-e.cr;return [escapeHtml(e.date),escapeHtml(e.ref),e.dr?money(e.dr/100):'—',e.cr?money(e.cr/100):'—',money(Math.abs(running)/100)+' '+(running>=0?'Dr':'Cr')]});const debit=entries.reduce((s,e)=>s+e.dr,0),credit=entries.reduce((s,e)=>s+e.cr,0);return `<h1>Account ledger</h1><div class="panel"><div class="account-actions"><button data-tab="Chart of Accounts">← Chart of Accounts</button><button data-tab="Reports">Trial Balance</button></div><h2>${escapeHtml(code)} · ${escapeHtml(name)}</h2><p class="muted">Account type: ${escapeHtml(type)} · Posted transactions (read-only)</p><div class="account-balance">${db.currency} ${money(Math.abs(running)/100)} ${running>=0?'Dr':'Cr'}</div><p>Total debits: ${db.currency} ${money(debit/100)} · Total credits: ${db.currency} ${money(credit/100)} · ${entries.length} posting(s)</p></div><div class="panel"><h2>Transaction history</h2>${table(['Date','Journal reference','Debit','Credit','Running balance'],rows)}</div><p class="muted">Balances reflect all posted entries. Account ledger is view-only; editing or reversing posted journals is not yet implemented.</p>`}
function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}">No records yet</td></tr>`}</tbody></table></div>`}

const printTypes=[['sales','Sales invoice'],['purchase','Vendor purchase invoice'],['receipt','Customer payment receipt'],['vendorpayment','Vendor payment voucher'],['pnl','Profit & Loss'],['balance','Balance Sheet'],['trial','Trial Balance']];
let printType='sales',printRecord='',printPaper='letter',printOrientation='portrait';
const printFmt=c=>`${escapeHtml(db.currency)} ${money(c/100)}`;
function printOptions(type){let arr=[];if(type==='sales')arr=db.invoices.map(x=>[x.id,`${x.id} · ${customerName(x.customer)}`]);if(type==='purchase')arr=db.vendorBills.map(x=>[x.id,`${escapeHtml(x.reference)} · ${vendorName(x.vendor)}`]);if(type==='receipt')arr=db.payments.map(x=>[x.id,`${x.id} · ${x.invoice}`]);if(type==='vendorpayment')arr=db.vendorPayments.map(x=>[x.id,`${x.id} · ${x.bill}`]);return arr}
function printCenter(){return `<h1>Print center</h1><div class="panel no-print"><p>Choose a document, review the final print preview, then select Print. Your browser or printer dialog controls the printer, copies, paper size, pages and destination (including Save as PDF when available).</p><label>Document type</label><select id="printType">${printTypes.map(([k,v])=>`<option value="${k}" ${k===printType?'selected':''}>${v}</option>`).join('')}</select><label>Document / transaction</label><select id="printRecord"></select><div class="two"><div><label>Preferred paper</label><select id="printPaper"><option value="letter" ${printPaper==='letter'?'selected':''}>US Letter (8.5 × 11 in)</option><option value="a4" ${printPaper==='a4'?'selected':''}>A4</option><option value="legal" ${printPaper==='legal'?'selected':''}>US Legal (8.5 × 14 in)</option></select></div><div><label>Orientation</label><select id="printOrientation"><option value="portrait" ${printOrientation==='portrait'?'selected':''}>Portrait</option><option value="landscape" ${printOrientation==='landscape'?'selected':''}>Landscape</option></select></div></div><p class="muted">Paper and orientation are preferences; verify them in the final browser print dialog. Number of copies is selected there, not stored in the accounting record.</p><p><button type="button" id="printNow">Print / Save as PDF</button></p></div><div class="panel"><h2>Final document preview</h2><div id="printPreview">Select a document to preview.</div></div>`}
function printRows(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${escapeHtml(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((x,i)=>`<td class="${i===row.length-1?'num':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function makePrintDocument(type,record){const company=escapeHtml(db.business),cur=escapeHtml(db.currency);let title='',subtitle='',body='';
 if(type==='sales'){const i=db.invoices.find(x=>x.id===record);if(!i)return null;title='SALES INVOICE';subtitle=`Invoice: ${escapeHtml(i.id)} · Date: ${escapeHtml(i.date)}`;body=`<p><strong>Bill to:</strong> ${customerName(i.customer)}</p>${printRows(['Description','Amount'],[[escapeHtml(i.description),printFmt(i.cents)]])}<p class="num"><strong>Total: ${printFmt(i.cents)}</strong></p><p class="num">Payments received: ${printFmt(i.cents-invoiceBalance(i))}</p><p class="num"><strong>Balance due: ${printFmt(invoiceBalance(i))}</strong></p>`}
 else if(type==='purchase'){const b=db.vendorBills.find(x=>x.id===record);if(!b)return null;title='VENDOR PURCHASE INVOICE — INTERNAL COPY';subtitle=`Supplier invoice: ${escapeHtml(b.reference)} · Recorded: ${escapeHtml(b.date)}`;body=`<p><strong>Vendor:</strong> ${vendorName(b.vendor)}</p>${printRows(['Product','Quantity','Unit cost','Line total'],billLines(b).map(l=>[itemName(l.item),String(l.quantity),printFmt(l.unitCost),printFmt(l.unitCost*l.quantity)]))}<p class="num"><strong>Invoice total: ${printFmt(billTotal(b))}</strong></p><p class="num">Paid: ${printFmt(paidBill(b))} · Due: ${printFmt(billDue(b))}</p><p>Goods received: ${billLines(b).reduce((s,l)=>s+receivedQty(b,l.id),0)} / ${billLines(b).reduce((s,l)=>s+l.quantity,0)} units</p><p class="muted">This is an internal reproduction of the supplier invoice, not a replacement for the original supplier document.</p>`}
 else if(type==='receipt'){const p=db.payments.find(x=>x.id===record);if(!p)return null;const i=db.invoices.find(x=>x.id===p.invoice);title='PAYMENT RECEIPT';subtitle=`Receipt: ${escapeHtml(p.id)} · Date: ${escapeHtml(p.date)}`;body=`<p><strong>Received from:</strong> ${i?customerName(i.customer):'Unknown'}</p><p>Against invoice: ${escapeHtml(p.invoice)}</p><h3>Amount received: ${printFmt(p.cents)}</h3><p class="muted">Payment method was not captured in this version of Customer Payments.</p>`}
 else if(type==='vendorpayment'){const p=db.vendorPayments.find(x=>x.id===record);if(!p)return null;const b=db.vendorBills.find(x=>x.id===p.bill);title='VENDOR PAYMENT VOUCHER';subtitle=`Voucher: ${escapeHtml(p.id)} · Date: ${escapeHtml(p.date)}`;body=`<p><strong>Payee:</strong> ${b?vendorName(b.vendor):'Unknown'}</p><p>Vendor invoice: ${b?escapeHtml(b.reference):escapeHtml(p.bill)}</p><p>Method: ${escapeHtml(vendorPaymentMethods[p.method]||p.method||'Not recorded')}</p><p>Reference: ${escapeHtml(p.reference||'—')}</p><h3>Amount paid: ${printFmt(p.cents)}</h3>`}
 else if(type==='pnl'){title='PROFIT & LOSS';subtitle=`Period: ${escapeHtml(reportFrom)} to ${escapeHtml(reportTo)}`;const b=datedBalances(reportFrom,reportTo);const rows=Object.entries(accounts).filter(([k,a])=>['Revenue','Expense'].includes(a[1])).map(([k,a])=>[escapeHtml(k+' '+a[0]),printFmt((a[1]==='Revenue'?-1:1)*(b[k]||0))]);const revenue=Object.entries(accounts).filter(([k,a])=>a[1]==='Revenue').reduce((s,[k])=>s-(b[k]||0),0);const expenses=Object.entries(accounts).filter(([k,a])=>a[1]==='Expense').reduce((s,[k])=>s+(b[k]||0),0);body=printRows(['Account','Amount'],rows)+`<p class="num"><strong>Net profit / (loss): ${printFmt(revenue-expenses)}</strong></p><p class="muted">Inventory invoices post FIFO cost of goods sold.</p>`}
 else if(type==='balance'){
   title='BALANCE SHEET';
   subtitle=`As at ${escapeHtml(balanceAsOf)}`;
   const b=datedBalances(null,balanceAsOf);
   const totals={Asset:0,Liability:0,Equity:0};
   const rows=[];
   let earnings=0;
   for(const [code,[name,type]] of Object.entries(accounts)){
     const value=b[code]||0;
     if(type==='Revenue'||type==='Expense'){earnings-=value;continue}
     const signed=type==='Asset'?value:-value;
     totals[type]+=signed;
     if(value)rows.push([escapeHtml(code+' '+name),type,printFmt(signed)]);
   }
   totals.Equity+=earnings;
   rows.push(['Unclosed earnings','Equity',printFmt(earnings)]);
   const liabilitiesAndEquity=totals.Liability+totals.Equity;
   body=printRows(['Account','Type','Amount'],rows)+printRows(['Total','Amount'],[
     ['Assets',printFmt(totals.Asset)],['Liabilities',printFmt(totals.Liability)],
     ['Equity including earnings',printFmt(totals.Equity)],
     ['Liabilities + equity',printFmt(liabilitiesAndEquity)],
     ['Accounting equation difference',printFmt(totals.Asset-liabilitiesAndEquity)]
   ]);
 }
 else if(type==='trial'){title='TRIAL BALANCE';subtitle='All posted transactions';const b=balances();body=printRows(['Account','Debit','Credit'],Object.entries(accounts).map(([k,a])=>[escapeHtml(k+' '+a[0]),b[k]>0?printFmt(b[k]):'—',b[k]<0?printFmt(-b[k]):'—']))}
 else return null;
 return `<div class="print-head"><div><h2>${company}</h2><p>${cur} · Universal Accounting Edition 2</p></div><div><h3>${title}</h3><p>${subtitle}</p></div></div>${body}<div class="print-foot">Generated ${new Date().toLocaleDateString('en-GB')} · Universal Accounting development edition · ${escapeHtml(db.business)}</div>`;
}
function refreshPrintCenter(){const t=document.getElementById('printType'),r=document.getElementById('printRecord'),preview=document.getElementById('printPreview');if(!t||!r||!preview)return;printType=t.value;const opts=printOptions(printType);r.disabled=!opts.length;r.innerHTML=opts.length?opts.map(([id,label])=>`<option value="${escapeHtml(id)}">${label}</option>`).join(''):`<option value="">${['sales','purchase','receipt','vendorpayment'].includes(printType)?'No transactions available':'Current report'}</option>`;if(opts.some(x=>x[0]===printRecord))r.value=printRecord;else printRecord=r.value;updatePrintPreview()}
function updatePrintPreview(){const el=document.getElementById('printPreview');if(!el)return;const doc=makePrintDocument(printType,printRecord);el.innerHTML=doc||'<p>No matching document to print. Record the transaction first.</p>';const btn=document.getElementById('printNow');if(btn)btn.disabled=!doc}
function doPrint(){const doc=makePrintDocument(printType,printRecord);if(!doc){message('Select a valid document before printing',true);return}const root=document.getElementById('printRoot');root.innerHTML=`<div id="printPreview">${doc}</div>`;const old=document.getElementById('uaPrintPageStyle');if(old)old.remove();const s=document.createElement('style');s.id='uaPrintPageStyle';s.textContent=`@media print{@page{size:${printPaper} ${printOrientation};margin:12mm}}`;document.head.appendChild(s);window.print()}

// Search existing customers/vendors before permitting a new master record.
function normalizeParty(name){return String(name||'').normalize('NFKC').trim().replace(/\s+/g,' ').toLocaleLowerCase()}
function setupPartyLookup(kind){
 const customer=kind==='customer',input=document.getElementById(kind+'Lookup');if(!input)return;
 const button=document.getElementById(customer?'addCustomerButton':'addVendorButton');
 const status=document.getElementById(kind+'LookupStatus'),matchesBox=document.getElementById(kind+'Matches');
 const idField=document.getElementById(kind+'GeneratedId'),records=customer?db.customers:db.vendors;
 const check=()=>{
  const term=normalizeParty(input.value),exactId=input.value.trim().toUpperCase();
  const matches=term?records.filter(x=>normalizeParty(x.name).includes(term)||normalizeParty(x.id).includes(term)||term.includes(normalizeParty(x.name))):[];
  const exact=matches.find(x=>normalizeParty(x.name)===term||x.id.toUpperCase()===exactId);
  button.disabled=!term||matches.length>0;
  idField.value=nextPartyId(kind);
  matchesBox.innerHTML=matches.slice(0,8).map(x=>`<button type="button" class="party-match" data-party-kind="${kind}" data-party-id="${escapeHtml(x.id)}">${escapeHtml(x.id)} · ${escapeHtml(x.name)}</button>`).join('');
  if(!term)status.textContent='Search by name or account ID. Add remains disabled until a new name is entered.';
  else if(exact)status.textContent='Existing record found. Select it below; do not create a duplicate.';
  else if(matches.length)status.textContent='Possible matching records found. Select the existing record below.';
  else if(/^(CUST|VEND)-?\d+$/i.test(input.value.trim())){button.disabled=true;status.textContent='An account ID is for searching only. Enter a new customer or vendor name to add.'}
  else status.textContent='No matching record found. New '+(customer?'customer':'vendor')+' may be added with the displayed ID.';
 };
 input.addEventListener('input',check);input.addEventListener('change',check);check();
}

const backupFormat='Universal Accounting encrypted backup';
const backupIterations=600000;
const backupEncoding=new TextEncoder();
function encodeBackupBytes(bytes){
 let binary='';
 for(let offset=0;offset<bytes.length;offset+=32768){
   binary+=String.fromCharCode(...bytes.subarray(offset,offset+32768));
 }
 return btoa(binary);
}
function decodeBackupBytes(value){return Uint8Array.from(atob(value),character=>character.charCodeAt(0))}
async function backupKey(password,salt){
 const material=await crypto.subtle.importKey('raw',backupEncoding.encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:backupIterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function exportBackup(encrypted){
 try{
   let json=JSON.stringify(db,null,2);
   if(encrypted){
     const password=prompt('Create a backup passphrase (at least 12 characters). Keep it in a safe place.');
     if(password===null)return;
     if(password.length<12)throw Error('Use a passphrase of at least 12 characters.');
     if(prompt('Confirm the backup passphrase.')!==password)throw Error('Backup passphrases did not match.');
     const salt=crypto.getRandomValues(new Uint8Array(16));
     const iv=crypto.getRandomValues(new Uint8Array(12));
     const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},await backupKey(password,salt),backupEncoding.encode(json));
     json=JSON.stringify({format:backupFormat,version:1,salt:encodeBackupBytes(salt),iv:encodeBackupBytes(iv),data:encodeBackupBytes(new Uint8Array(ciphertext))});
   }
   if(window.AndroidBackup){window.AndroidBackup.save(json);return}
   const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
   const link=document.createElement('a');
   link.href=url;
   link.download=encrypted?'universal-accounting-encrypted-backup.json':'universal-accounting-backup.json';
   link.click();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 }catch(error){message(error.message,true)}
}
async function decryptBackup(data,password){
 if(data.version!==1||typeof data.salt!=='string'||data.salt.length!==24
   ||typeof data.iv!=='string'||data.iv.length!==16||typeof data.data!=='string')throw Error('Invalid encrypted backup');
 try{
   const salt=decodeBackupBytes(data.salt),iv=decodeBackupBytes(data.iv);
   if(salt.length!==16||iv.length!==12)throw Error('Invalid encryption parameters');
   const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv},await backupKey(password,salt),decodeBackupBytes(data.data));
   return JSON.parse(new TextDecoder().decode(plaintext));
 }catch{throw Error('Incorrect passphrase or damaged encrypted backup.')}
}
function validateBackup(data){
 const collections=['journals','customers','invoices','payments','vendors','items','vendorBills','receipts','vendorPayments'];
 if(data?.version!==2||typeof data.business!=='string'||!Object.hasOwn(supportedCurrencies,data.currency)
   ||!Number.isSafeInteger(data.next)||data.next<1||collections.some(key=>!Array.isArray(data[key])
     ||data[key].some(row=>!row||typeof row!=='object'||Array.isArray(row))))throw Error('Invalid backup structure');
 if(data.drafts!==undefined&&(!Array.isArray(data.drafts)||data.drafts.some(draft=>
   !draft||typeof draft.id!=='string'||!documentForms.has(draft.formId)||typeof draft.summary!=='string'
   ||!draft.fields||Array.isArray(draft.fields)||typeof draft.fields!=='object'
   ||Object.values(draft.fields).some(value=>typeof value!=='string')||!Array.isArray(draft.lines)
   ||draft.lines.some(line=>!line||['item','quantity','cost'].some(key=>typeof line[key]!=='string'))
   ||(draft.formId==='billForm'&&!draft.lines.length))))throw Error('Invalid saved drafts');
 const custom=new Set();
 for(const account of data.customAccounts||[]){
   if(!account||!/^\d{4,6}$/.test(account.code)||Object.hasOwn(baseAccounts,account.code)
     ||custom.has(account.code)||!Array.isArray(account.tuple)||typeof account.tuple[0]!=='string'
     ||!['Asset','Liability','Equity','Revenue','Expense'].includes(account.tuple[1]))throw Error('Invalid backup account');
   custom.add(account.code);
 }
 for(const journal of data.journals){
   validDate(journal.date);
   if(typeof journal.ref!=='string'||!Array.isArray(journal.lines)||journal.lines.length<2)throw Error('Invalid backup journal');
   let balance=0n;
   for(const line of journal.lines){
     if(!line||(!Object.hasOwn(baseAccounts,line.acct)&&!custom.has(line.acct))
       ||!Number.isSafeInteger(line.dr)||!Number.isSafeInteger(line.cr)||line.dr<0||line.cr<0
       ||Boolean(line.dr)===Boolean(line.cr))throw Error('Invalid backup journal line');
     balance+=BigInt(line.dr)-BigInt(line.cr);
   }
   if(balance!==0n)throw Error('Unbalanced backup journal');
 }
}
document.addEventListener('change',async e=>{
 if(e.target.id==='receiptBill'){refreshReceiptLines();return}
 if(e.target.id==='receiptLine'){refreshReceiptHint();return}
 if(e.target.id!=='import'||!e.target.files[0])return;
 try{
   let data=JSON.parse(await e.target.files[0].text());
   if(data?.format===backupFormat){
     const password=prompt('Enter the backup passphrase.');
     if(password===null)return;
     data=await decryptBackup(data,password);
   }
   validateBackup(data);
   if(!confirm('Replace current records with this backup?'))return;
   localStorage.setItem(KEY,JSON.stringify(data));
   db=data;
   document.getElementById('businessTitle').textContent=db.business;
   render();
   message('Backup restored. Verify reports before use.');
 }catch(err){message(err.message,true)}
 finally{e.target.value=''}
});
function refreshReceiptLines(){const bs=document.getElementById('receiptBill'),ls=document.getElementById('receiptLine');if(!bs||!ls)return;const b=db.vendorBills.find(x=>x.id===bs.value);ls.innerHTML=b?billLines(b).filter(l=>receivedQty(b,l.id)<l.quantity).map(l=>`<option value="${l.id}">${itemName(l.item)} · ${l.quantity-receivedQty(b,l.id)} remaining</option>`).join(''):'';refreshReceiptHint()}
function refreshReceiptHint(){const bs=document.getElementById('receiptBill'),ls=document.getElementById('receiptLine'),hint=document.getElementById('receiptRemaining'),q=document.getElementById('receiptQty');if(!bs||!ls||!hint||!q)return;const b=db.vendorBills.find(x=>x.id===bs.value),l=b&&billLines(b).find(x=>x.id===ls.value);const remain=l?l.quantity-receivedQty(b,l.id):0;hint.textContent=l?`Outstanding quantity: ${remain} · Unit cost: ${db.currency} ${money(l.unitCost/100)}`:'No product lines awaiting receipt';q.max=String(remain);q.value=''}
function updateBillTotal(){const root=document.getElementById('billLines');if(!root)return;let total=0;for(const el of root.children){const q=Number(el.querySelector('.line-qty').value)||0,c=parseDisplayNumber(el.querySelector('.line-cost').value)||0;const sub=q*c;el.querySelector('.line-subtotal').textContent='Line total: '+db.currency+' '+money(sub);total+=sub}document.getElementById('billGrandTotal').textContent='Invoice total: '+db.currency+' '+money(total)}
function previewPricing(){const f=document.getElementById('pricingForm');if(!f)return;const d=new FormData(f),c=Number(d.get('cost')),r=Number(d.get('rate')),method=d.get('method'),fixed=Number(d.get('price'));let p=method==='markup'?c*(1+r/100):method==='margin'&&r<100?c/(1-r/100):method==='profit'?c+fixed:method==='fixed'?fixed:NaN;document.getElementById('pricePreview').textContent=c>0&&Number.isFinite(p)&&p>0?'Calculated selling price: '+db.currency+' '+money(p):'Enter valid cost and pricing options.'}
document.addEventListener('focusout',e=>{if(monetaryField(e.target))formatMonetaryInput(e.target)});
document.addEventListener('input',e=>{
 if(e.target.id==='salesItemLookup'){
  const query=e.target.value.trim().toLowerCase();
  const matches=db.items.filter(item=>query&&[item.id,item.sku,item.name].some(value=>value.toLowerCase()===query));
  const product=e.target.form.elements.namedItem('product');
  e.target.setCustomValidity(query&&matches.length!==1?'Select a matching inventory item or clear the lookup.':'');
  if(matches.length===1){
   product.value=matches[0].id;
   product.dispatchEvent(new Event('change',{bubbles:true}));
  }else{
   const description=e.target.form.elements.namedItem('description');
   if(description.value===db.items.find(item=>item.id===product.value)?.name)description.value='';
   product.value='';
  }
 }
 if(e.target.closest('#billLines'))updateBillTotal();if(e.target.closest('#pricingForm'))previewPricing()});document.addEventListener('change',e=>{
 if(e.target.id==='salesProduct'){
  const item=db.items.find(item=>item.id===e.target.value);
  const lookup=e.target.form.querySelector('#salesItemLookup');
  lookup.value=item?.sku||'';
  lookup.setCustomValidity('');
  if(item)e.target.form.elements.namedItem('description').value=item.name;
 }
 if(e.target.closest('#pricingForm'))previewPricing()});
render();

/* First-run business setup: shared by Android and Windows desktop builds. */
function showFirstRunSetup(){
  const hasSavedBusiness=!!localStorage.getItem(KEY);
  if(hasSavedBusiness)return;
  const cover=document.createElement('div');
  cover.id='firstRunSetup';
  cover.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(12,28,44,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto';
  cover.innerHTML='<section style="background:white;color:#17324d;max-width:530px;width:100%;border-radius:14px;padding:24px;box-shadow:0 15px 50px #0006"><h2>Welcome to Universal Accounting</h2><p>Set up your business before entering transactions. This information stays on this device.</p><form id="firstRunForm"><label>Business name *<input name="business" required maxlength="120" style="width:100%;padding:10px;margin:6px 0 14px" placeholder="Your business name"></label><label>Base currency <select name="currency" style="width:100%;padding:10px;margin:6px 0 14px">'+Object.entries(supportedCurrencies).map(([code,name])=>'<option value="'+code+'" '+(code==='JMD'?'selected':'')+'>'+code+' — '+name+'</option>').join('')+'</select></label><label>Financial year begins (month) <select name="fiscalMonth" style="width:100%;padding:10px;margin:6px 0 14px">'+Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+new Date(2024,i,1).toLocaleString('en',{month:'long'})+'</option>').join('')+'</select></label><p style="font-size:13px">A standard chart of accounts is provided. Opening balances can be entered later using the accounting functions. Export regular JSON backups from Settings.</p><button type="submit" style="padding:12px 18px;background:#17324d;color:white;border:0;border-radius:8px;cursor:pointer">Create business</button></form><p role="status"></p></section>';
  document.body.appendChild(cover);
  const form=cover.querySelector('form');
  form.addEventListener('submit',e=>{
    e.preventDefault();e.stopPropagation();
    const d=new FormData(form),name=String(d.get('business')||'').trim(),currency=String(d.get('currency')),month=Number(d.get('fiscalMonth'));
    if(!name||!Object.hasOwn(supportedCurrencies,currency)||!Number.isInteger(month)||month<1||month>12)return;
    db.business=name;db.currency=currency;db.fiscalYearStartMonth=month;db.setupCompleted=true;
    try{
      save();
      const year=today.getFullYear()-(today.getMonth()<month-1?1:0);
      reportFrom=localISO(new Date(year,month-1,1));
      reportTo=localISO(new Date(year,month-1+12,0));
      cover.remove();
      render();
      message('Business created. Export a backup regularly.');
    }catch(error){cover.querySelector('[role=status]').textContent=error.message}
  });
}
showFirstRunSetup();
